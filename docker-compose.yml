#---
#version: '2'
services:

  sqlserver:
    image: ${DOCKER_IMAGE}
    hostname: sqlserver
    user: root
    container_name: sqlserver
    networks:
      - integration
    restart: always
    env_file:
      - env/sqlserver.env
    environment:
      TZ: Asia/Macau
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: 2048
      MSSQL_AGENT_ENABLED: 1
      #MSSQL_COLLATION: Latin1_General_CS_AS
      # SA_PASSWORD should be set in env/sqlserver.env or a secret manager
      # Do NOT commit secrets into the repo
      # Optional: set a memory cap for the container (in MB)
    ports:
      - 1433:1433
    volumes:
      - ./src/mssql-init:/mssql-init
      - sql-server-data:/var/opt/mssql/
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P \"$$SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sql-server-data:
    driver: local

networks:
  integration:
    driver: bridge
