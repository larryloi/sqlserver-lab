#---
#version: '2'
services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU15-ubuntu-22.04
    hostname: sqlserver
    user: root
    container_name: sqlserver
    networks:
      - integration
    restart: always
    env_file:
      - env/sqlserver.env
    environment:
      TZ: Asia/Macau
      ACCEPT_EULA: Y
      SA_PASSWORD: Abcd1234
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: 2048
      MSSQL_AGENT_ENABLED: 1
      #MSSQL_COLLATION: Latin1_General_CS_AS
    ports:
      - 1433:1433
    volumes:
      - ./src/mssql-init:/mssql-init
      - sql-server-data:/var/opt/mssql/
      #- ./sqlserver.crt:/var/opt/mssql/certs/sqlserver.crt
      #- ./sqlserver.key:/var/opt/mssql/certs/sqlserver.key
      #    command: 
      #- /opt/mssql/bin/mssql-conf
      #- set
      #- network.tlscert
      #- /var/opt/mssql/certs/sqlserver.crt
      #- set
      #- network.tlskey
      #- /var/opt/mssql/certs/sqlserver.key
      #- set
      #- network.tlsprotocols
      #- "1.2"
      #- set
      #- network.forceencryption
      #- "1"

volumes:
  sql-server-data:
    driver: local

networks:
  integration:
    driver: bridge
